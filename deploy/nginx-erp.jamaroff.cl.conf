# Nginx para erp.jamaroff.cl — archivo propio, no toca los sitios de otros proyectos.
# Instalar:
#   sudo cp deploy/nginx-erp.jamaroff.cl.conf /etc/nginx/sites-available/erp.jamaroff.cl
#   sudo ln -s /etc/nginx/sites-available/erp.jamaroff.cl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.jamaroff.cl      (agrega el HTTPS a este mismo archivo)
#
# Puertos internos: deben calzar con API_PORT y WEB_PORT del .env

server {
    listen 80;
    listen [::]:80;
    server_name erp.jamaroff.cl;

    # Archivos Excel de ventas/liquidaciones (la API acepta hasta 20 MB)
    client_max_body_size 25m;

    access_log /var/log/nginx/erp.jamaroff.cl.access.log;
    error_log  /var/log/nginx/erp.jamaroff.cl.error.log;

    # API (NestJS): las rutas ya empiezan con /api
    location /api/ {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # cargas de archivos grandes
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}