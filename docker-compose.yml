# Nombre del proyecto en Docker. En el VPS se cambia con COMPOSE_PROJECT_NAME en el .env
# para que sus contenedores y volúmenes no se mezclen con los de otros proyectos.
name: erp-retail

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      # Solo accesible desde el mismo equipo (127.0.0.1), nunca desde internet
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aún no se usa. Para levantarlo: docker compose --profile redis up -d
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: